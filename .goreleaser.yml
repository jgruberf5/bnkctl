# goreleaser config for bnkctl.
# Run with: goreleaser release --clean (after tagging a release)
# Cross-compile sweep: linux/darwin/windows × amd64/arm64.
version: 2

project_name: bnkctl

before:
  hooks:
    - go mod tidy

builds:
  - id: bnkctl
    main: ./cmd/bnkctl
    binary: bnkctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jgruberf5/bnkctl/internal/cli.Version={{.Version}}
      - -X github.com/jgruberf5/bnkctl/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/jgruberf5/bnkctl/internal/cli.BuildDate={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
